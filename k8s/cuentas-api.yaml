# Servicio de cuentas: solo ClusterIP, sin Ingress. Únicamente IG lo llama.
# Volumen para la base SQLite (StorageClass por defecto de Minikube: hostPath).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mibanco-cuentas-db
  namespace: lab
  labels:
    app.kubernetes.io/part-of: mibanco-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mibanco-cuentas-api
  namespace: lab
  labels:
    app.kubernetes.io/name: mibanco-cuentas-api
    app.kubernetes.io/part-of: mibanco-demo
spec:
  # SQLite admite un solo escritor: una réplica y sin solapar Pods al actualizar
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mibanco-cuentas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mibanco-cuentas-api
        app.kubernetes.io/part-of: mibanco-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001 # permite escribir en el volumen de la base
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mibanco-cuentas-api:1.0.0
          # La imagen se construye dentro del Docker de Minikube; nunca se descarga
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CUENTAS_LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: db
              mountPath: /srv/var # CUENTAS_DATABASE_PATH por defecto: /srv/var/cuentas.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: mibanco-cuentas-db
---
apiVersion: v1
kind: Service
metadata:
  name: mibanco-cuentas-api
  namespace: lab
  labels:
    app.kubernetes.io/name: mibanco-cuentas-api
    app.kubernetes.io/part-of: mibanco-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mibanco-cuentas-api
  ports:
    - name: http
      port: 8000
      targetPort: http
