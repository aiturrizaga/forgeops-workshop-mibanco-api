# Plantilla del Secret con la clave del cliente de introspección de IG.
# NO subir este archivo con el valor real. Preferible crearlo por línea de comandos:
#   kubectl -n lab create secret generic mibanco-ig-introspect \
#     --from-literal=MIBANCO_IG_INTROSPECT_SECRET='<secret del cliente en AM>'
#
# IG lo lee con SystemAndEnvSecretStore: el secret id "mibanco.ig.introspect.secret"
# se busca como variable de entorno MIBANCO_IG_INTROSPECT_SECRET (formato PLAIN).
apiVersion: v1
kind: Secret
metadata:
  name: mibanco-ig-introspect
  namespace: lab
  labels:
    app.kubernetes.io/part-of: mibanco-demo
type: Opaque
stringData:
  MIBANCO_IG_INTROSPECT_SECRET: "<reemplazar>"
